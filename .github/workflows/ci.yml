name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:

# Least privilege: every job in this workflow only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned toolchain versions recorded into every release artifact's provenance.
  NODE_VERSION: '20'
  RUST_TOOLCHAIN: '1.81.0'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      contracts: ${{ steps.filter.outputs.contracts }}
      docker: ${{ steps.filter.outputs.docker }}
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            contracts:
              - 'stellar-contracts/**'
            docker:
              - 'backend/Dockerfile'
              - 'frontend/Dockerfile'
              - 'docker-compose.yml'
              - 'nginx/**'
            release:
              - '.github/workflows/ci.yml'
              - 'backend/Dockerfile'
              - 'frontend/Dockerfile'
              - 'stellar-contracts/**'

  conflict-markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for merge conflict markers
        run: |
          if git grep -nE '^(<{7}|={7}|>{7}|\|{7})( |$)' -- . ':!*.md'; then
            echo "Merge conflict markers found"
            exit 1
          fi

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Security audit
        run: npm run security:audit

  # Case-sensitive filesystems (Linux and every CI runner) resolve import
  # specifiers exactly, so a casing typo that works on macOS/Windows breaks
  # the build - or, for a `React.lazy` route, blanks the page at runtime
  # instead of failing loudly (#744). The check is dependency-free on
  # purpose, so it runs without the frontend install.
  import-case:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check relative import casing
        run: node frontend/scripts/check-import-case.mjs
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint -- --max-warnings 0
      - name: Typecheck frontend
        run: npm run typecheck
      # `npm test` maps to `vitest run` (see frontend/package.json) so the
      # 16 existing src/**/*.test.ts[x] suites are actually executed here.
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 18 is EOL; supported lines are 20 (LTS) and 22.
        node-version: ['20', '22']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Lint backend
        run: npm run lint -- --max-warnings 0
      - name: Typecheck backend
        run: npm run typecheck
      - name: Build backend
        run: npm run build
      - name: Test backend
        run: npm test -- --ci

  # The unit suite above never imports AppModule end to end, so the
  # test/*.e2e-spec.ts suites (auth, users, certificate manager, versioning)
  # were dead code. They boot a real Nest application, which needs PostgreSQL
  # and the Redis instance backing BullMQ.
  backend-e2e:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: stellarwave_user
          POSTGRES_PASSWORD: stellarwave_password
          POSTGRES_DB: stellarwave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stellarwave_user -d stellarwave"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3000
      DB_TYPE: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: stellarwave_user
      DB_PASSWORD: stellarwave_password
      DB_NAME: stellarwave
      # Let TypeORM derive the schema from the entities instead of replaying
      # migrations that are only built for the production image.
      TYPEORM_SYNCHRONIZE: 'true'
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret-not-used-in-production
      JWT_ACCESS_SECRET: ci-only-jwt-secret-not-used-in-production
      JWT_REFRESH_SECRET: ci-only-jwt-secret-not-used-in-production
      JWT_EXPIRES_IN: 24h
      STELLAR_NETWORK: testnet
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_ISSUER_SECRET_KEY: ''
      STELLAR_ISSUER_PUBLIC_KEY: ''
      ALLOWED_ORIGINS: http://localhost:5173
      ENABLE_SENTRY: 'false'
      # No object storage in CI; the files module must not require it to boot.
      STORAGE_REQUIRED: 'false'
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: stellar-cert
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Run backend e2e tests
        run: npm run test:e2e -- --ci --runInBand

  # Nothing built the images or parsed nginx.conf, so a broken Dockerfile or
  # nginx directive could reach a release. Build every documented target.
  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build --target production -t stellarcert-backend:ci ./backend
      - name: Build frontend development image
        run: docker build --target development -t stellarcert-frontend:dev ./frontend
      - name: Build frontend production image
        run: docker build --target production -t stellarcert-frontend:prod ./frontend
      - name: Validate nginx configuration
        run: |
          # nginx -t parses ssl_certificate directives, so the TLS files that
          # production mounts must exist even for a syntax check.
          mkdir -p nginx/ssl
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout nginx/ssl/key.pem -out nginx/ssl/cert.pem -subj "/CN=localhost"
          docker run --rm \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/nginx/ssl:/etc/nginx/ssl:ro" \
            nginx:alpine nginx -t

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stellar-contracts
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: stellar-contracts
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        # Warnings are errors: the deprecated soroban-sdk event API usage has
        # been migrated, so any new warning (including a re-introduced
        # deprecation) must fail CI instead of accumulating silently.
        run: cargo clippy --all-targets -- -D warnings
      - name: Build contracts
        run: cargo build
      # deploy-contracts.sh ships target/wasm32-unknown-unknown/release, which
      # a plain host build does not produce or validate.
      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Build contracts for wasm target
        run: cargo build --target wasm32-unknown-unknown --release
      - name: Test contracts
        run: cargo test

  # Builds immutable, versioned image and WASM artifacts from the recorded
  # source revision and pinned toolchain, then emits SBOMs, checksums, and
  # SLSA-style provenance. Promotion consumes these exact bytes; it never
  # rebuilds. See docs/releases.md for the rollback/verification procedure.
  release-artifacts:
    needs: [changes, frontend, backend, contracts, docker]
    if: |
      always() &&
      needs.changes.outputs.release == 'true' &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.contracts.result == 'success' || needs.contracts.result == 'skipped') &&
      (needs.docker.result == 'success' || needs.docker.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      source-revision: ${{ steps.meta.outputs.source-revision }}
      artifact-digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Record source revision and version
        id: meta
        run: |
          set -euo pipefail
          REVISION="$(git rev-parse HEAD)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="0.0.0-${GITHUB_SHA::12}"
          fi
          echo "source-revision=${REVISION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        id: backend-image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          push: true
          provenance: true
          sbom: true
          build-args: |
            SOURCE_REVISION=${{ steps.meta.outputs.source-revision }}
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ steps.meta.outputs.build-date }}
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}/backend:sha-${{ steps.meta.outputs.source-revision }}
      - name: Build and push frontend image
        id: frontend-image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          push: true
          provenance: true
          sbom: true
          build-args: |
            SOURCE_REVISION=${{ steps.meta.outputs.source-revision }}
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ steps.meta.outputs.build-date }}
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}/frontend:sha-${{ steps.meta.outputs.source-revision }}
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - name: Build contract WASM reproducibly
        working-directory: stellar-contracts
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export RUSTFLAGS="--remap-path-prefix=$PWD=/build/stellar-contracts"
          cargo build --locked --target wasm32-unknown-unknown --release
      - name: Collect WASM artifacts
        run: |
          set -euo pipefail
          mkdir -p dist/wasm
          find stellar-contracts/target/wasm32-unknown-unknown/release \
            -maxdepth 1 -name '*.wasm' -exec cp {} dist/wasm/ \;
          ls -la dist/wasm
      - name: Generate SBOMs
        uses: anchore/sbom-action@v0
        with:
          path: ./dist
          format: spdx-json
          output-file: dist/sbom.spdx.json
      - name: Generate checksums
        run: |
          set -euo pipefail
          ( cd dist && find . -type f ! -name 'checksums.txt' -print0 \
              | sort -z | xargs -0 sha256sum ) > dist/checksums.txt
          cat dist/checksums.txt
      - name: Write release manifest
        id: manifest
        run: |
          set -euo pipefail
          cat > dist/release-manifest.json <<EOF
          {
            "sourceRevision": "${{ steps.meta.outputs.source-revision }}",
            "version": "${{ steps.meta.outputs.version }}",
            "buildDate": "${{ steps.meta.outputs.build-date }}",
            "toolchain": {
              "node": "${{ env.NODE_VERSION }}",
              "rust": "${{ env.RUST_TOOLCHAIN }}"
            },
            "images": {
              "backend": "ghcr.io/${{ github.repository }}/backend@${{ steps.backend-image.outputs.digest }}",
              "frontend": "ghcr.io/${{ github.repository }}/frontend@${{ steps.frontend-image.outputs.digest }}"
            }
          }
          EOF
          DIGEST="$(sha256sum dist/release-manifest.json | cut -d' ' -f1)"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/**'
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.meta.outputs.version }}
          path: dist/
          retention-days: 90

  # Promotion gate: verifies artifact identity against the recorded manifest
  # and refuses to proceed if bytes differ. Promotion never rebuilds.
  verify-promotion:
    needs: release-artifacts
    if: needs.release-artifacts.result == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.release-artifacts.outputs.source-revision }}
          path: dist
      - name: Verify checksums
        run: |
          set -euo pipefail
          ( cd dist && sha256sum -c checksums.txt )
      - name: Verify manifest digest
        run: |
          set -euo pipefail
          ACTUAL="$(sha256sum dist/release-manifest.json | cut -d' ' -f1)"
          EXPECTED="${{ needs.release-artifacts.outputs.artifact-digest }}"
          if [[ "${ACTUAL}" != "${EXPECTED}" ]]; then
            echo "Manifest digest mismatch: expected ${EXPECTED}, got ${ACTUAL}" >&2
            exit 1
          fi
      - name: Verify image digests match manifest
        run: |
          set -euo pipefail
          BACKEND_REF="$(jq -r '.images.backend' dist/release-manifest.json)"
          FRONTEND_REF="$(jq -r '.images.frontend' dist/release-manifest.json)"
          docker buildx imagetools inspect "${BACKEND_REF}" >/dev/null
          docker buildx imagetools inspect "${FRONTEND_REF}" >/dev/null
      - name: Record deployed artifact mapping
        run: |
          set -euo pipefail
          mkdir -p deployment
          cat > deployment/deployed-artifacts.json <<EOF
          {
            "sourceRevision": "${{ needs.release-artifacts.outputs.source-revision }}",
            "artifactDigest": "${{ needs.release-artifacts.outputs.artifact-digest }}",
            "environment": "staging",
            "contracts": $(jq -c '[.wasm // {}] | .[0]' dist/release-manifest.json 2>/dev/null || echo '{}')
          }
          EOF
          cat deployment/deployed-artifacts.json
      - name: Upload deployment record
        uses: actions/upload-artifact@v4
        with:
          name: deployed-artifacts-staging
          path: deployment/deployed-artifacts.json
          retention-days: 90
