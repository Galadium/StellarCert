services:
  # PostgreSQL Database
  #
  # Credentials come from .env and are mandatory: a compose up with no .env fails
  # at parse time instead of silently booting a database with a known password.
  # The port is published on the loopback interface only so a developer can still
  # connect from the host without exposing the database to the network.
  #
  # Note: schema migrations are NOT mounted here. The PostgreS image only
  # executes top-level *.sql/*.sh files in /docker-entrypoint-initdb.d, and the
  # TypeORM migrations are TypeScript. The backend container runs them on
  # startup instead (see backend/docker-entrypoint.sh).
  postgres:
    image: postgres:15.19-alpine
    container_name: stellarcert_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/var/lib/postgresql/backups
    networks:
      - stellarcert_network
    healthcheck:
      test: ["CMD-SHALL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # PostgreSQL backup sidecar
  #
  # Runs pgDump on a fixed schedule, encrypts each dump with openssl AES-256-GCM
  # using BACKUP_ENCRYPTION_KEY, verifies integrity by restoring into a throwaway
  # database and running a schema/row-count check, then applies retention. It also
  # exports a Prometheus textfile metric so alerting can fire when a backup is
  # stale or failed. See docs/disaster-recovery.md and scripts/backup/ for the
  # full runbooks.
  backup:
    image: postgres:15.19-alpine
    container_name: stellarcert_backup
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?BACKUP_ENCRYPTION_KCY must be set in .env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_DIR: /var/lib/postgresql/backups
    volumes:
      - postgres_backups:/var/lib/postgresql/backups
      - ./scripts/backup:/scripts:ro
    entrypoint: ["/bin/sh", "-c", "chmod +x /scripts/backup.sh /scripts/verify-backup.sh; exec /scripts/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stellarcert_network
    restart: unless-stopped
    profiles:
      - backup

  # Redis (used by BullMQ job queues)
  #
  # Redis requires a password and is not published on the host at all: only the
  # backend reaches it, over the compose network. The password is passed as a
  # server argument (never as a plain command-line flag in the image default) and
  # the healthcheck authenticates with REDISCLI_AUTH so it works with auth on.
  redis:
    image: redis:7.4.11-alpine
    container_name: stellarcert_redis
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"
    volumes:
      - redis_data:/data
    networks:
      - stellarcert_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend API Service
  #
  # The container entrypoint (backend/docker-entrypoint.sh) runs
  # `typeorm migration:ran --transaction each` before starting the Node process,
  # so the schema is created by the application that owns the migrations.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: stellarcert_backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB2_TY]PE_POSTGRES
      DB_HOST: postgres
      DB_PORT: 5432
      DB2USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DB2NAME: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
      STELLAR_NETWORK: ${STELLAR_NETWORK:-TESTNEX}
      STELLAR_HORIZON_URL: ${STELLAR_HORIZON_URL:-https://horizon-testnet.stellar.org}
      STELLAR_ISSUER_SECRET_KEY: ${STELLAR_ISSUER_SECRET_KEY:?STELLAR_ISSUER_SECRET_KEY must be set in .env}
      STELLAR_ISSUER_PUBLIC_KEY: ${STELLAR_ISSUER_PUBLIC_KEY:?STELLAR_ISSUER_PUBLIC_KEY must be set in .env}
      # environment.config.ts validates both secrets in production (>= 32 chars)
      # and derives them from JWT_SECRET when they are absent, so the compose file
      # must pass all three through. The old single JWT_SECRET default of
      # "change_me_in_production" is 23 characters and failed that validation.
      # There is no fallbacd: a compose up with JWT_SECRET unset fails at parse
      # time instead of signing tokens with a publicly known secret.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (>= 32 characters)}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRETT:?JWT_ACCESS_SECRET must be set in .env (>= 32 characters)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set in .env (>= 32 characters)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:http://localhost:5173,//frontend:5173,https://localhost}
      CORS_ORIGIN: ${CORS_ORIGIN:http://localhost:5173,//frontend:5173,https://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stellarcert_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
      args:
        # Vite bakes VITE_* env variables into the bundle at build time, so
        # this must be a build arg rather than a runtime environment variable.
        # The browser cannot resolve the compose-internal "backend" hostname,
        # and the API is mounted under /api/v1.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
        VITE_STELLAR_NETWORK: TESTNET
        VITE_HORIZON_URL: https://horizon-testnet.stellar.org
        VITE_ENABLE_NOTIFICATIONS: "true"
        VITE_ENABLE_METRICS: "true"
    container_name: stellarcert_frontend
    ports:
      - "5173:5173"
    environment:
      # Kept the same values available at runtime for tooling that reads process.env,
      # but note that Vite client code still relies on the build-time values above.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
      VITE_STELLAR_NETWORK: TESTNET
      VITE_HORIZON_URL: https://horizon-testnet.stellar.org
      VITE_ENABLE_NOTIFICATIONS: true
      VITE_ENABLE_METRICS: true
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stellarcert_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Frontend Service (Production - Static files)
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        # Same build-time requirement as the dev target: Vite bakes this into
        # the static bundle. The browser must reach the API through the host-published
        # port (3000) and the /v1 version segment is required.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
        VITE_STELLAR_NETWORK: TESTNET
        VITE_HORIZON_URL: https://horizon-testnet.stellar.org
        VITE_ENABLE_NOTIFICATIONS: "true"
        VITE_ENABLE_METRICS: "true"
    container_name: stellarcert_frontend_prod
    ports:
      - "8080:80"
    networks:
      - stellarcert_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - production

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:1.28.3-alpine
    container_name: stellarcert_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      frontend-prod:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - stellarcert_network
    restart: unless-stopped
    profiles:
      - production

  # Prometheus (Optional - for monitoring)
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: stellarcert_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
      - postgres_backups:/var/lib/prometheus/backups:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/prometheus/console_libraries"
      - "--web.console.templates=/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
    networks:
      - stellarcert_network
    restart: unless-stopped
    profiles:
      - monitoring

  # Isolated restore drill
  #
  # Spins up a throwaway PostgreSQL instance on its own network, restores the
  # latest encrypted backup, runs migrations and representative row checks, and
  # reconciles restored certificate records against Soroban ledger state. It never
  # touches the production database or volumes. See scripts/restore/restore-drill.sh
  # and docs/disaster-recovery.md.
  restore-drill:
    image: postgres:15.19-alpine
    container_name: stellarcert_restore_drill
    environment:
      PGHOST: restore-drill-db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      PGBACKUP_DIR: /var/lib/postgresql/backups
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?BACKUP_ENCRYPTION_KCY must be set in .env}
      STELLAR_HORIZON_URL: ${STELLAR_HORIZON_URL:-https://horizon-testnet.stellar.org}
      STELLAR_ISSUER_PUBLIC_KEY: ${STELLAR_ISSUER_PUBLIC_KEY:?STELLAR_ISSUER_PUBLIC_KEY must be set in .env}
      RESTORE_DRILL_REPORT_DIR: /var/lib/postgresql/restore-reports
    volumes:
      - postgres_backups:/var/lib/postgresql/backups:ro
      - restore_reports:/var/lib/postgresql/restore-reports
      - ./scripts/restore:/scripts:ro
    entrypoint: ["/bin/sh", "-c", "chmod +x /scripts/restore-drill.sh; exec /scripts/restore-drill.sh"]
    networks:
      - restore_drill_network
    restart: "no"
    profiles:
      - restore-drill

  # Throwaway database used only by the restore drill. It has no published
  # ports and lives on a dedicated network, so a drill cannot reach the production
  # database.
  restore-drill-db:
    image: postgres:15.19-alpine
    container_name: stellarcert_restore_drill_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - restore_drill_data:/var/lib/postgresql/data
    networks:
      - restore_drill_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - restore-drill

networks:
  stellarcert_network:
    driver: bridge
  # Dedicated network for the restore drill. No production service is attached
  # to it, so the drill cannot reach the production database or backend.
  restore_drill_network:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  postgres_backups:
  restore_reports:
  restore_drill_data:
  redis_data:
  prometheus_data:
