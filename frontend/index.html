<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StellarCert</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the persisted/system theme before the first paint to avoid a
      // flash of the wrong theme (FOUC). Mirrors ThemeContext's STORAGE_KEY
      // ('stellar-cert-theme') and prefers-color-scheme fallback.
      (function () {
        try {
          var stored = localStorage.getItem("stellar-cert-theme");
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = stored === "dark" || (stored !== "light" && systemDark);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* ignore storage/matchMedia access errors */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
