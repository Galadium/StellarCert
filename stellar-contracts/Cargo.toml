[package]
name = "certificate-revocation"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdrlib_lib", "rlib"]

[dependencies]
soroban-sdk = "29.0.1"

[dev-dependencies]
soroban-sdk = { version = "29.0.1", features = ["testutils"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
# Trap on integer overflow instead of silently wrapping in the deployed WASM.
overflow-checks = true
